<!doctype html>
<html lang="{{ site.locale | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/all.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/agency.css' | relative_url }}">
  </head>
  <body id="page-top">
    {{ content }}
    {% include footer.html %}
    <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/jquery.easing.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/agency.min.js' | relative_url }}"></script>
  </body>
</html>
