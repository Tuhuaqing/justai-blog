---
layout: default
---
{% include navheader.html %}

<section class="page-section" id="posts">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">最新文章</h2>
        <h3 class="section-subheading text-muted">持续记录值得沉淀的技术实践。</h3>
      </div>
    </div>
    <div class="row">
      {% for post in site.posts %}
      <div class="col-md-10 mx-auto mb-4">
        <article class="p-4 border rounded bg-light">
          <p class="text-muted mb-2">{{ post.date | date: "%Y-%m-%d" }}</p>
          <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
          <p class="mb-0">{{ post.description }}</p>
        </article>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
