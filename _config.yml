# justai-blog 站点配置
# 文章只使用标准 Front Matter；Agency 主题相关的首页文案与导航放在 _data/。

title: Just AI Blog
name: Just Tu
author: Just Tu
description: >-
  记录 AI、云原生与边缘计算相关领域长期技术博客。
  由 Jekyll + GitHub Pages 驱动，写 Markdown 即发布。

locale: "zh-CN"
timezone: Asia/Shanghai

url: "https://justtu.com"
baseurl: ""

# Agency Bootstrap 主题，固定到已验证的上游提交，防止远程主题无提示漂移。
# 主题源码: https://github.com/raviriley/agency-jekyll-theme
remote_theme: "raviriley/agency-jekyll-theme@d477a171ec9633c980c8ef9098eeac39b60ceba3"

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false
highlighter: rouge

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/images/README.md
  - vendor
  - .github
  - .bundle

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
