# =============================================================================
# 将 Jekyll 站点构建并发布到 GitHub Pages
# =============================================================================
# 流程：push 到 main → checkout → Ruby + Bundler 安装 → Jekyll 构建 →
#       上传 artifact → deploy-pages 发布
#
# 使用项目锁定的 Ruby 4 / Bundler 依赖树构建，再以 Pages artifact 部署。
#
# Runner 镜像：显式固定为 ubuntu-26.04，不使用 ubuntu-latest。
#   ubuntu-latest 是一个会被重新指向的移动别名，GitHub 已宣布在
#   2026-10-19 ~ 2026-11-19 期间把它从 Ubuntu 24.04 迁移到 Ubuntu 26.04，
#   也就是说底层系统会在无提示的情况下变化。固定版本让镜像升级成为一次
#   显式、可回滚、可验证的改动，与 _config.yml 固定主题 commit 的思路一致。
#   参考：https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration/
#   升级方式：改下面两处 runs-on，先 push 一个临时分支跑通构建，再合入 main。
#
# 前提（一次性）：仓库 Settings → Pages → Build and deployment →
#                 Source 选择 "GitHub Actions"。
# =============================================================================
name: Build and Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# GITHUB_TOKEN 的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，排队而不取消（避免中间状态发布）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------- 构建阶段 ----------
  build:
    runs-on: ubuntu-26.04 # 固定镜像版本，不用 ubuntu-latest（见文件头说明）
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # ---------- 部署阶段 ----------
  deploy:
    needs: build
    runs-on: ubuntu-26.04 # 与 build 保持一致，避免镜像漂移
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
